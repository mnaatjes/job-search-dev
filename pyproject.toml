[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "job-search-dev"
version = "0.1.0"
description = "Programmatic job search intake, scraping, and analytics toolkit"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Michael Naatjes" }
]
dependencies = [
    "python-jobspy>=1.1.80",
    "pandas>=2.1.0",
    "pydantic>=2.3.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
